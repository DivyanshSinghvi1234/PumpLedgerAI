# ─────────────────────────────────────────────
# PumpLedgerAI – Render Blueprint
# ─────────────────────────────────────────────
# Two services:
#   1. pumpledger-backend  (FastAPI / Python web service)
#   2. pumpledger-frontend (React / Static Site)
#
# Environment variables are NOT committed here.
# Set them in the Render dashboard under each service.
# ─────────────────────────────────────────────

services:
  # ─── 1. FastAPI Backend ───────────────────
  - type: web
    name: pumpledger-backend
    runtime: python
    region: singapore          # closest to Neon ap-southeast-1
    plan: free                 # upgrade when ready
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # NOTE: do NOT run `alembic upgrade` here. This prod DB's schema was built by
    # SQLAlchemy create_all, but its alembic_version pointer is stale
    # (44e5dce5cfe0), so `upgrade head` tries to re-run historical CREATE
    # migrations against objects that already exist (e.g. `CREATE TYPE fueltype`
    # -> DuplicateObject) and crash-loops the deploy. Schema stays in sync via
    # create_all + init_db.check_and_update_schema() (idempotent ADD COLUMN
    # backfills) at app startup. To adopt Alembic later, first run a ONE-OFF
    # `alembic stamp head` against prod, then wire `alembic upgrade head` back in.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # ── Database (Neon PostgreSQL) ──────────
      - key: DATABASE_URL
        sync: false            # set manually in Render dashboard

      # ── AI Keys ────────────────────────────
      - key: GOOGLE_API_KEY
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: "meta-llama/llama-4-scout-17b-16e-instruct"

      # ── Security ───────────────────────────
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure secret

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: ALGORITHM
        value: "HS256"

      # ── App ────────────────────────────────
      - key: APP_NAME
        value: "PumpLedger API"

      - key: APP_VERSION
        value: "1.0.0"

      - key: DEBUG
        value: "False"         # Always False in production

      - key: AI_PROVIDER
        value: "gemini"

      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"

      - key: DEFAULT_ADMIN_USERNAME
        value: "admin"

      - key: DEFAULT_ADMIN_PASSWORD
        sync: false            # set a strong password in dashboard

      - key: DEFAULT_ADMIN_FULL_NAME
        value: "Administrator"

  # ─── 2. React Frontend (Static Site) ──────
  - type: web
    name: pumpledger-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point to the backend Web Service URL (set in Render dashboard after backend deploys)
      - key: VITE_API_BASE_URL
        sync: false
